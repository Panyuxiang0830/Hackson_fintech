<section data-slot="audit-workbench" class="audit-workbench">
  <section class="audit-ai-panel">
    <div class="audit-section-heading"><div><span class="audit-eyebrow">ASK ACROSS YOUR AUDIT RECORDS</span><h2>Ask audit AI</h2></div><span class="material-symbols-outlined">auto_awesome</span></div>
    <form data-slot="audit-ai-form"><label class="audit-input-label" for="audit-ai-question">What would you like to investigate?</label><textarea id="audit-ai-question" data-slot="audit-ai-question" maxlength="4000" rows="2" placeholder="What did Jax access today, and who changed his permissions?"></textarea><div class="audit-ai-controls"><label>Time range<select data-slot="audit-ai-range"><option value="24h">Last 24 hours</option><option value="all">All recorded times</option><option value="custom">Custom range (SGT)</option></select></label><div data-slot="audit-ai-custom" class="audit-custom-range" hidden><label>From (SGT)<input type="datetime-local" data-slot="audit-ai-start"></label><label>To (SGT)<input type="datetime-local" data-slot="audit-ai-end"></label></div><button type="submit" class="audit-primary-button" data-slot="audit-ai-submit">Ask audit AI</button></div></form>
    <div data-slot="audit-ai-result" class="audit-ai-result" hidden></div><div data-slot="audit-ai-scope" class="audit-scope-text"></div>
  </section>
  <div data-slot="audit-domains" class="audit-domain-grid"></div>
  <details class="audit-system-tools"><summary>System events and audit tools</summary><p>Identity selection, audit queries and service diagnostics are kept separately from the four activity categories.</p><button type="button" data-action="audit-system-events">Browse system events</button><div data-slot="audit-system-events"></div></details>
  <dialog data-slot="audit-event-dialog" class="audit-event-dialog"><div class="audit-section-heading"><h2 data-slot="audit-event-heading">Audit event</h2><button type="button" data-action="audit-detail-close" aria-label="Close audit event">Close</button></div><div data-slot="audit-event-content"></div><button type="button" data-action="audit-event-export">Export event JSON</button></dialog>
</section>
