name: Project consistency

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check requirement synchronization
        run: python3 scripts/project_sync.py --check
      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v
